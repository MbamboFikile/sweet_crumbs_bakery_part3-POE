<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="View our showcase gallery of baked creations, custom cakes, and artisanal baked goods.">
  <title>Sweet Crumbs Bakery | Gallery</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FAF6F0; color: #2C1D18; font-family: 'Segoe UI', sans-serif; }
    .container { width: min(92%, 72rem); margin-inline: auto; }
    main.container { padding-block: 2.5rem 4rem; }

    .site-header { background: linear-gradient(135deg, #4A1525, #6A2438); color: #fff; padding-block: 2rem 1.4rem; }
    .header-inner { display: grid; gap: 1.5rem; }
    .brand h1 { color: #fff; }
    .eyebrow { color: #D49B35; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }

    .main-nav { display: flex; gap: 0.6rem; flex-wrap: wrap; }
    .main-nav a { border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; color: #fff; font-weight: 700; padding: 0.55rem 1.1rem; text-decoration: none; }
    .main-nav a.active { background: #D49B35; color: #2C1D18; }

    .section-card { background: #fff; border: 1px solid #E5D8CD; border-radius: 1.25rem; margin-block: 1.8rem; padding: 2rem; box-shadow: 0 0.75rem 2rem rgba(44,29,24,0.08); }

    .gallery-grid { display: grid; gap: 1.3rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .gallery-item { background: #fff; border: 1px solid #E5D8CD; border-radius: 0.9rem; overflow: hidden; cursor: pointer; }
    .gallery-item img { aspect-ratio: 1; object-fit: cover; width: 100%; transition: transform 0.3s ease; }
    .gallery-item:hover img { transform: scale(1.05); }
    .gallery-item figcaption { font-weight: 700; padding: 0.75rem; color: #4A1525; text-align: center; }

    /* Lightbox Modal */
    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .lightbox.active { opacity: 1; pointer-events: auto; }
    .lightbox img { max-width: 90%; max-height: 80vh; border-radius: 0.5rem; }
    .lightbox-close { position: absolute; top: 2rem; right: 2rem; color: #fff; font-size: 2.5rem; cursor: pointer; }

    .site-footer { background: #2C1D18; color: #FAF6F0; padding-block: 2.5rem; text-align: center; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <p class="eyebrow">Baked with Love & Precision</p>
        <h1>Sweet Crumbs Bakery</h1>
      </div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="products.html">Products</a>
        <a class="active" href="gallery.html">Gallery</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section-card">
      <div style="margin-bottom: 1.5rem;">
        <p class="eyebrow">Visual Gallery</p>
        <h2 style="color: #4A1525;">Our Custom Creations</h2>
        <p style="color: #64534D;">Click any image to open full-screen preview mode.</p>
      </div>

      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="images/cake-showcase.jpg" alt="Custom Celebration Cake" onerror="this.src='https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80'">
          <figcaption>Custom Tiered Celebration Cake</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/cupcakes.png" alt="Gourmet Cupcakes" onerror="this.src='https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?auto=format&fit=crop&w=600&q=80'">
          <figcaption>Gourmet Frosted Cupcakes</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/bread.jpg" alt="Artisanal Breads" onerror="this.src='https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80'">
          <figcaption>Artisanal Sourdough & Breads</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Sweet Crumbs Bakery. All Rights Reserved.</p>
      <p>Fikile Mbambo | ST10469237 | Web Development | WEDE5020W</p>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const galleryItems = document.querySelectorAll('.gallery-item img');
      const lightbox = document.createElement('div');
      lightbox.className = 'lightbox';
      lightbox.innerHTML = `<span class="lightbox-close">&times;</span><img>`;
      document.body.appendChild(lightbox);

      const lightboxImg = lightbox.querySelector('img');
      const closeBtn = lightbox.querySelector('.lightbox-close');

      galleryItems.forEach(img => {
        img.parentElement.addEventListener('click', () => {
          lightboxImg.src = img.src;
          lightbox.classList.add('active');
        });
      });

      closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) lightbox.classList.remove('active');
      });
    });
  </script>
</body>
</html>
